# Proposal preview (RES-1379). Access is gated by Traefik (X-Preview header, or the rvxp cookie that ?k= sets).
map $arg_k $setck { default ""; "~^[A-Za-z0-9]{16,64}$" "rvxp=$arg_k; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax"; }
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  client_max_body_size 210m;
  gzip on; gzip_types text/css application/javascript image/svg+xml text/plain;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Set-Cookie $setck always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $rfq_up "http://revalx-proposal-rfq:8000";
    proxy_pass $rfq_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
  }
  location / { try_files $uri $uri/index.html =404; }
  location /assets/ { expires 1h; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow" always; }
}
