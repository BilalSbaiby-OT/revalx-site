server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self' https://buy.stripe.com mailto:" always;
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~* \.(css|svg|png|ico)$ { expires 7d; add_header Cache-Control "public"; }
}
