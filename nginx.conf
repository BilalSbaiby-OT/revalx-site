server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'" always;
  # RES-1071: same-origin relay for cookieless PostHog capture; variable proxy_pass so nginx still starts if DNS is down
  location = /riq-e {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ph_up eu.i.posthog.com;
    proxy_pass https://$ph_up/i/v0/e/;
    proxy_set_header Host eu.i.posthog.com;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header Content-Type text/plain;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s; proxy_read_timeout 5s;
    access_log off;
  }
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~* \.(css|svg|png|ico)$ { expires 7d; add_header Cache-Control "public"; }
}
